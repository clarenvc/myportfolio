<div
  id="add-education-modal"
  class="skill-form-modal"
  popover="auto"
  role="dialog"
  aria-modal="true"
  aria-labelledby="add-education-modal-title"
>
  <button
    type="button"
    class="skill-form-modal__backdrop"
    popovertarget="add-education-modal"
    popovertargetaction="hide"
    aria-label="CancelABC"
  ></button>

  <div class="skill-form-modal__content">
    <button
      type="button"
      class="skill-form-modal__close"
      popovertarget="add-education-modal"
      popovertargetaction="hide"
      aria-label="Close form"
    >
      ×
    </button>

    <h2 id="add-education-modal-title">Add New Education</h2>
    <form
      id="education-form"
      method="post"
      action="{% url 'main:create_education' %}"
      class="skill-form"
    >
      {% csrf_token %} 
      
      {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }} 
        {% for error in field.errors %}
        <p class="form-error">{{ error }}</p>
        {% endfor %}
      </div>
      {% endfor %}
      
      <div class="skill-form-modal__actions">
        <button
          type="button"
          class="button button-secondary"
          popovertarget="add-education-modal"
          popovertargetaction="hide"
        >
          Cancel
        </button>
        <button type="submit" class="button">Add education</button>
      </div>
    </form>
  </div>
</div>
