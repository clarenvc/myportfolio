{% extends "base.html" %}

{% block meta %}
<title>Add Education - {{ nickname }}</title>
{% endblock meta %}

{% block content %}
<main>
  <section class="experience-section">
    <div class="container">
      <h1 style="margin-bottom: 1.5rem;">Form Education</h1>
      
      <form method="post" style="max-width: 100%; display: flex; flex-direction: column; gap: 1rem;">
        {% csrf_token %}
        
        {% for field in form %}
        <div style="display: flex; flex-direction: column; gap: 0.4rem;">
          <label for="{{ field.id_for_label }}" style="font-weight: bold;">{{ field.label }}</label>
          {{ field }}
          
          <!-- Menampilkan Error jika input tidak valid -->
          {% for error in field.errors %}
          <span style="color: #b42318; font-size: 0.85rem;">{{ error }}</span>
          {% endfor %}
        </div>
        {% endfor %}
        
        <div style="margin-top: 1rem; display: flex; gap: 1rem;">
            <button type="submit" style="background: var(--accent); color: white; border: none; padding: 0.65rem 1.5rem; border-radius: var(--radius); font-weight: bold; cursor: pointer; font-family: 'Times New Roman', serif;">Save</button>
            <a href="{% url 'main:show_education' %}" style="background: var(--ink); color: white; padding: 0.65rem 1.5rem; text-decoration: none; border-radius: var(--radius); font-weight: bold; font-family: 'Times New Roman', serif;">Cancel</a>
        </div>
      </form>
    </div>
  </section>
</main>
{% endblock content %}
